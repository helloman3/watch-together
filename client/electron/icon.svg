<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d19" />
      <stop offset="50%" stop-color="#121629" />
      <stop offset="100%" stop-color="#07080e" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9" />
    </linearGradient>

    <!-- Play Icon Vibrant Gradient -->
    <linearGradient id="play-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Ring 1 Gradient (Host/You) -->
    <linearGradient id="ring1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Ring 2 Gradient (Friend/Together) -->
    <linearGradient id="ring2-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="4" filter="url(#shadow-drop)" />

  <!-- Background Ambient Nebula Glows -->
  <circle cx="170" cy="200" r="110" fill="#6366f1" opacity="0.18" filter="url(#glow-strong)" />
  <circle cx="340" cy="290" r="110" fill="#ec4899" opacity="0.15" filter="url(#glow-strong)" />
  <circle cx="256" cy="256" r="80" fill="#06b6d4" opacity="0.12" filter="url(#glow-strong)" />

  <!-- Interconnected Sync Rings (Togetherness Concept) -->
  <!-- Left User Ring -->
  <circle cx="210" cy="256" r="100" fill="none" stroke="url(#ring1-grad)" stroke-width="12" stroke-dasharray="140 30 80 30" opacity="0.75" filter="url(#glow-subtle)" />
  
  <!-- Right Friend Ring -->
  <circle cx="302" cy="256" r="100" fill="none" stroke="url(#ring2-grad)" stroke-width="12" stroke-dasharray="100 40 120 40" opacity="0.75" filter="url(#glow-subtle)" />

  <!-- Broadcast Pulse Wave Arcs (Top Right) -->
  <path d="M 370 140 A 50 50 0 0 1 405 175" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.85" filter="url(#glow-subtle)" />
  <path d="M 390 120 A 80 80 0 0 1 445 175" fill="none" stroke="#818cf8" stroke-width="8" stroke-linecap="round" opacity="0.55" filter="url(#glow-subtle)" />

  <!-- Central Cinema Play Emblem -->
  <!-- Subtle Back Glow -->
  <polygon points="215,165 350,256 215,347" fill="#6366f1" opacity="0.5" filter="url(#glow-strong)" />

  <!-- Main Crisp Solid Play Button -->
  <path d="M 218 174 C 218 165 228 159 236 164 L 343 246 C 350 250 350 262 343 266 L 236 348 C 228 353 218 347 218 338 Z" fill="url(#play-grad)" filter="url(#shadow-drop)" />

  <!-- Play Button Gloss Highlight -->
  <path d="M 224 184 L 330 256 L 224 256 Z" fill="#ffffff" opacity="0.25" />

  <!-- Live Sync Nodes / Sparkles -->
  <circle cx="210" cy="156" r="7" fill="#38bdf8" filter="url(#glow-subtle)" />
  <circle cx="302" cy="356" r="7" fill="#ec4899" filter="url(#glow-subtle)" />
  <circle cx="350" cy="175" r="5" fill="#a5b4fc" filter="url(#glow-subtle)" />
  <circle cx="160" cy="310" r="4" fill="#818cf8" opacity="0.8" />
</svg>
